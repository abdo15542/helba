name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Add INTERNET permission to the main manifest
        shell: bash
        run: |
          # The flutter create template puts INTERNET only in the
          # debug/profile manifests, so release APKs ship WITHOUT it and
          # Android denies the app all network access (connect() fails with
          # EPERM). Patch the main manifest so every build has it.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          if "android.permission.INTERNET" in source:
              print("INTERNET permission already present")
          else:
              lines = source.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if line.lstrip().startswith("<manifest"):
                      j = i
                      while ">" not in lines[j]:
                          j += 1
                      lines.insert(j + 1, '    <uses-permission android:name="android.permission.INTERNET" />\n')
                      break
              else:
                  raise SystemExit("Could not find <manifest> tag in AndroidManifest.xml")
              path.write_text("".join(lines))
              print("Added INTERNET permission to AndroidManifest.xml")
          PY

      - name: Verify INTERNET permission in manifest
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || (echo "INTERNET permission missing from AndroidManifest.xml" && exit 1)

      - name: Add deep-link intent filter to the main manifest
        shell: bash
        run: |
          # The email-confirmation link must open the app (helba://auth/...)
          # instead of a browser page, and so must chat links
          # (helba://chat/<id>) from push notifications. The generated
          # manifest has no such filter, so insert one into MainActivity
          # (before </activity>). Idempotent, and repairs a filter that
          # only has the auth entry: the guard checks each data entry,
          # not just the scheme.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          auth_entry = '<data android:scheme="helba" android:host="auth" />'
          chat_entry = '<data android:scheme="helba" android:host="chat" />'
          if auth_entry in source and chat_entry in source:
              print("Deep-link intent filter already present (auth + chat)")
          elif auth_entry in source:
              # Filter exists but the chat entry is missing: add just that line.
              source = source.replace(auth_entry,
                                      auth_entry + '\n            ' + chat_entry, 1)
              path.write_text(source)
              print("Added chat deep-link data entry to intent filter")
          else:
              block = (
                  '        <intent-filter>\n'
                  '            <action android:name="android.intent.action.VIEW" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '            <category android:name="android.intent.category.BROWSABLE" />\n'
                  '            ' + auth_entry + '\n'
                  '            ' + chat_entry + '\n'
                  '        </intent-filter>\n'
              )
              marker = '</activity>'
              if marker not in source:
                  raise SystemExit("Could not find </activity> in AndroidManifest.xml")
              source = source.replace(marker, block + marker, 1)
              path.write_text(source)
              print("Added deep-link intent filter to AndroidManifest.xml")
          PY

      - name: Verify deep-link intent filter in manifest
        run: |
          grep -q 'android:scheme="helba"' android/app/src/main/AndroidManifest.xml || (echo "Deep-link intent filter missing from AndroidManifest.xml" && exit 1)
          grep -q 'android:host="auth"' android/app/src/main/AndroidManifest.xml || (echo "Auth deep-link entry missing from AndroidManifest.xml" && exit 1)
          grep -q 'android:host="chat"' android/app/src/main/AndroidManifest.xml || (echo "Chat deep-link entry missing from AndroidManifest.xml" && exit 1)

      - name: Add call permissions to the main manifest
        shell: bash
        run: |
          # Voice/video calls need the microphone and the camera. These
          # are dangerous permissions: the manifest entries below only
          # declare them — the app still asks the user at runtime (via
          # permission_handler) before getUserMedia. Same patch style as
          # the INTERNET step above; idempotent, skipped if already present.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          wanted = [
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
          ]
          missing = [p for p in wanted if p not in source]
          if not missing:
              print("Call permissions already present")
          else:
              lines = source.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if line.lstrip().startswith("<manifest"):
                      j = i
                      while ">" not in lines[j]:
                          j += 1
                      for k, perm in enumerate(missing):
                          lines.insert(j + 1 + k, f'    <uses-permission android:name="{perm}" />\n')
                      break
              else:
                  raise SystemExit("Could not find <manifest> tag in AndroidManifest.xml")
              path.write_text("".join(lines))
              print("Added call permissions to AndroidManifest.xml: " + ", ".join(missing))
          PY

      - name: Verify call permissions in manifest
        run: |
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml || (echo "RECORD_AUDIO permission missing from AndroidManifest.xml" && exit 1)
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || (echo "CAMERA permission missing from AndroidManifest.xml" && exit 1)

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              updated = source.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36",
              ).replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36",
              )
              if updated == source:
                  if "compileSdk = 36" in source or "compileSdkVersion 36" in source:
                      print(f"{path} already targets compile SDK 36")
                      raise SystemExit(0)
                  continue
              path.write_text(updated)
              print(f"Updated {path} to compile SDK 36")
              raise SystemExit(0)
          raise SystemExit("Could not find a supported Android app Gradle file or compileSdk setting")
          PY

      - name: Enable core library desugaring
        shell: bash
        run: |
          # flutter_local_notifications 22 requires core library desugaring
          # in the app module, or the build fails at checkReleaseAarMetadata
          # ("Dependency ':flutter_local_notifications' requires core library
          # desugaring to be enabled for :app"). The flutter create template
          # does not enable it, so patch the generated app Gradle file:
          # turn the flag on in compileOptions and add the desugar library.
          # Idempotent, and handles both the Kotlin (.kts) and Groovy
          # (.gradle) templates.
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              is_kts = path.suffix == ".kts"
              if "LibraryDesugaringEnabled" not in source:
                  marker = "compileOptions {"
                  if marker not in source:
                      raise SystemExit("Could not find compileOptions block in " + str(path))
                  flag = ("isCoreLibraryDesugaringEnabled = true"
                          if is_kts else
                          "coreLibraryDesugaringEnabled true")
                  source = source.replace(marker, marker + "\n        " + flag, 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if "desugar_jdk_libs" not in source:
                  if "dependencies {" in source:
                      source = source.replace("dependencies {",
                                              "dependencies {\n    " + dep, 1)
                  else:
                      source = source.rstrip() + "\n\ndependencies {\n    " + dep + "\n}\n"
              path.write_text(source)
              print(f"Enabled core library desugaring in {path}")
              raise SystemExit(0)
          raise SystemExit("Could not find a supported Android app Gradle file")
          PY

      - name: Verify core library desugaring
        run: |
          grep -q 'LibraryDesugaringEnabled' android/app/build.gradle* || (echo "Core library desugaring flag missing from app Gradle file" && exit 1)
          grep -q 'desugar_jdk_libs' android/app/build.gradle* || (echo "Desugar library missing from app Gradle file" && exit 1)

      - name: Install Android compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: flutter pub get

      - name: Align Android plugin compile SDK versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path("android"), Path.home() / ".pub-cache" / "hosted" / "pub.dev"]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("build.gradle*"):
                  try:
                      lines = path.read_text().splitlines()
                  except (OSError, UnicodeDecodeError):
                      continue
                  updated = []
                  count = 0
                  for line in lines:
                      stripped = line.strip()
                      # Rewrite EVERY compileSdk declaration to 36, whatever
                      # value it carries (34, 35, 37, flutter.compileSdkVersion
                      # or a literal). The old rule only matched "34" and
                      # flutter.compileSdkVersion, so it missed
                      # permission_handler_android 14.x, which declares
                      # compileSdk = 37 with AGP 9 — and the build then
                      # failed with "cannot find symbol" for API-36
                      # symbols (ACCESS_LOCAL_NETWORK, CINNAMON_BUN).
                      if stripped.startswith("compileSdk"):
                          indent = line[:len(line) - len(line.lstrip())]
                          if stripped.startswith("compileSdk ="):
                              line = indent + "compileSdk = 36"
                          elif stripped.startswith("compileSdkVersion"):
                              line = indent + "compileSdkVersion 36"
                          elif stripped.startswith("compileSdk "):
                              line = indent + "compileSdk 36"
                          count += 1
                      updated.append(line)
                  if count:
                      path.write_text("\n".join(updated) + "\n")
                      changed.append(f"{path}: {count}")
          if not changed:
              # Plugins already align: that is a pass, not a failure.
              # Failing here used to break the build on every Flutter/plugin
              # update that already shipped compileSdk 36.
              print("No Android compileSdk declarations needed adjustment")
          else:
              print("Aligned Android compileSdk declarations to 36:")
              print("\n".join(changed))
          PY

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Force compile SDK 36 for every Android module
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/force-compile-sdk.gradle" <<'EOF'
          allprojects {
              afterEvaluate {
                  def androidExtension = extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileSdkVersion(36)
                      println("HELBA: forced compileSdk 36 for " + project.path)
                  }
              }
          }
          EOF

      - name: Build release APK
        shell: bash
        run: |
          # Use repository secrets when configured; otherwise the build falls
          # back to the defaults compiled into lib/main.dart. Previously the
          # build silently ignored the secrets entirely.
          args=(--release --verbose)
          # Bake the commit SHA into the app so the login screen can show
          # which build is installed.
          args+=(--dart-define=HELBA_COMMIT=${{ github.sha }})
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            args+=(--dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }})
          fi
          if [ -n "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" ]; then
            args+=(--dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }})
          fi
          flutter build apk "${args[@]}"

      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helba-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
