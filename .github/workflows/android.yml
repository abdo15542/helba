name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              updated = source.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36",
              ).replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36",
              )
              if updated == source:
                  if "compileSdk = 36" in source or "compileSdkVersion 36" in source:
                      print(f"{path} already targets compile SDK 36")
                      raise SystemExit(0)
                  continue
              path.write_text(updated)
              print(f"Updated {path} to compile SDK 36")
              raise SystemExit(0)
          raise SystemExit("Could not find a supported Android app Gradle file or compileSdk setting")
          PY

      - name: Install Android compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: flutter pub get

      - name: Align Android plugin compile SDK versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path("android"), Path.home() / ".pub-cache" / "hosted" / "pub.dev"]
          changed = []
          pattern = re.compile(
              r"(?m)^(\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?)(?:flutter\\.compileSdkVersion|[0-9]+)(\\s*(?:\\n|$))"
          )
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("build.gradle*"):
                  try:
                      source = path.read_text()
                  except (OSError, UnicodeDecodeError):
                      continue
                  updated, count = pattern.subn(r"\\g<1>36\\g<2>", source)
                  if count:
                      path.write_text(updated)
                      changed.append(f"{path}: {count}")
          if not changed:
              raise SystemExit("No Android compileSdk declarations found to verify")
          print("Aligned Android compileSdk declarations to 36:")
          print("\\n".join(changed))
          PY

      - name: Verify Android compile SDK configuration
        run: |
          grep -R -n -E 'compileSdk(Version)?[[:space:]]*(=[[:space:]]*)?(34|flutter\\.compileSdkVersion)' android "$HOME/.pub-cache/hosted/pub.dev" --include='build.gradle' --include='build.gradle.kts' || true
          grep -R -n -E 'compileSdk(Version)?[[:space:]]*(=[[:space:]]*)?36' android/app "$HOME/.pub-cache/hosted/pub.dev/file_picker-"*"/android" --include='build.gradle' --include='build.gradle.kts' || true

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helba-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
