name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              updated = source.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36",
              ).replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36",
              )
              if updated == source:
                  if "compileSdk = 36" in source or "compileSdkVersion 36" in source:
                      print(f"{path} already targets compile SDK 36")
                      raise SystemExit(0)
                  continue
              path.write_text(updated)
              print(f"Updated {path} to compile SDK 36")
              raise SystemExit(0)
          raise SystemExit("Could not find a supported Android app Gradle file or compileSdk setting")
          PY

      - name: Install Android compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: flutter pub get

      - name: Align Android plugin compile SDK versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path("android"), Path.home() / ".pub-cache" / "hosted" / "pub.dev"]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("build.gradle*"):
                  try:
                      lines = path.read_text().splitlines()
                  except (OSError, UnicodeDecodeError):
                      continue
                  updated = []
                  count = 0
                  for line in lines:
                      stripped = line.strip()
                      if stripped.startswith("compileSdk") and ("flutter.compileSdkVersion" in stripped or "34" in stripped):
                          indent = line[:len(line) - len(line.lstrip())]
                          if stripped.startswith("compileSdk ="):
                              line = indent + "compileSdk = 36"
                          elif stripped.startswith("compileSdkVersion"):
                              line = indent + "compileSdkVersion 36"
                          count += 1
                      updated.append(line)
                  if count:
                      path.write_text("\n".join(updated) + "\n")
                      changed.append(f"{path}: {count}")
          if not changed:
              # Plugins already align: that is a pass, not a failure.
              # Failing here used to break the build on every Flutter/plugin
              # update that already shipped compileSdk 36.
              print("No Android compileSdk declarations needed adjustment")
          else:
              print("Aligned Android compileSdk declarations to 36:")
              print("\n".join(changed))
          PY

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Force compile SDK 36 for every Android module
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/force-compile-sdk.gradle" <<'EOF'
          allprojects {
              afterEvaluate {
                  def androidExtension = extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileSdkVersion(36)
                      println("HELBA: forced compileSdk 36 for " + project.path)
                  }
              }
          }
          EOF

      - name: Build release APK
        shell: bash
        run: |
          # Use repository secrets when configured; otherwise the build falls
          # back to the defaults compiled into lib/main.dart. Previously the
          # build silently ignored the secrets entirely.
          args=(--release --verbose)
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            args+=(--dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }})
          fi
          if [ -n "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" ]; then
            args+=(--dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }})
          fi
          flutter build apk "${args[@]}"

      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helba-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
