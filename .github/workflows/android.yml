name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Flutter
        # Pinned to the latest v2.x release, verified 2026-11-06 via the
        # GitHub releases API (v2.23.0, published 2026-03-25). Do not
        # float on @v2: a stable-channel bump can change the manifest /
        # Gradle template strings the patch steps below match.
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Install stable debug keystore
        shell: bash
        run: |
          # The release build is signed with signingConfigs.debug, i.e.
          # ~/.android/debug.keystore (verified against the flutter create
          # template: the generated build.gradle.kts sets
          # signingConfig = signingConfigs.getByName("debug") for the
          # release build type, and there is no key.properties or custom
          # signing in the repo). A fresh runner has no keystore, so
          # Gradle would generate a new ephemeral one and every build
          # would carry a different signature — the app could then only
          # be installed after uninstalling (which wipes the E2E keys in
          # secure storage). The repo commits one stable debug keystore
          # (android/app/debug.keystore, a debug key — its only role is
          # signature stability across builds); copy it into place so
          # every build signs identically and updates install over the
          # previous one. Fail LOUDLY if it is missing: a silent fallback
          # to an ephemeral keystore must never happen. (flutter create
          # preserves android/app/debug.keystore — verified locally —
          # so this check runs after generation on purpose.)
          if [ ! -f android/app/debug.keystore ]; then
            echo "ERROR: android/app/debug.keystore is missing from the repo — refusing to build with an ephemeral keystore" && exit 1
          fi
          mkdir -p ~/.android
          cp android/app/debug.keystore ~/.android/debug.keystore
          echo "Installed stable debug keystore"

      - name: Add INTERNET permission to the main manifest
        shell: bash
        run: |
          # The flutter create template puts INTERNET only in the
          # debug/profile manifests, so release APKs ship WITHOUT it and
          # Android denies the app all network access (connect() fails with
          # EPERM). Patch the main manifest so every build has it.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          if "android.permission.INTERNET" in source:
              print("INTERNET permission already present")
          else:
              lines = source.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if line.lstrip().startswith("<manifest"):
                      j = i
                      while ">" not in lines[j]:
                          j += 1
                      lines.insert(j + 1, '    <uses-permission android:name="android.permission.INTERNET" />\n')
                      break
              else:
                  raise SystemExit("Could not find <manifest> tag in AndroidManifest.xml")
              path.write_text("".join(lines))
              print("Added INTERNET permission to AndroidManifest.xml")
          PY

      - name: Verify INTERNET permission in manifest
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || (echo "INTERNET permission missing from AndroidManifest.xml" && exit 1)

      - name: Add deep-link intent filter to the main manifest
        shell: bash
        run: |
          # The email-confirmation link must open the app (helba://auth/...)
          # instead of a browser page, and so must chat links
          # (helba://chat/<id>) from push notifications. The generated
          # manifest has no such filter, so insert one into MainActivity
          # (before </activity>). Idempotent, and repairs a filter that
          # only has the auth entry: the guard checks each data entry,
          # not just the scheme.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          auth_entry = '<data android:scheme="helba" android:host="auth" />'
          chat_entry = '<data android:scheme="helba" android:host="chat" />'
          if auth_entry in source and chat_entry in source:
              print("Deep-link intent filter already present (auth + chat)")
          elif auth_entry in source:
              # Filter exists but the chat entry is missing: add just that line.
              source = source.replace(auth_entry,
                                      auth_entry + '\n            ' + chat_entry, 1)
              path.write_text(source)
              print("Added chat deep-link data entry to intent filter")
          else:
              block = (
                  '        <intent-filter>\n'
                  '            <action android:name="android.intent.action.VIEW" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '            <category android:name="android.intent.category.BROWSABLE" />\n'
                  '            ' + auth_entry + '\n'
                  '            ' + chat_entry + '\n'
                  '        </intent-filter>\n'
              )
              marker = '</activity>'
              if marker not in source:
                  raise SystemExit("Could not find </activity> in AndroidManifest.xml")
              source = source.replace(marker, block + marker, 1)
              path.write_text(source)
              print("Added deep-link intent filter to AndroidManifest.xml")
          PY

      - name: Verify deep-link intent filter in manifest
        run: |
          grep -q 'android:scheme="helba"' android/app/src/main/AndroidManifest.xml || (echo "Deep-link intent filter missing from AndroidManifest.xml" && exit 1)
          grep -q 'android:host="auth"' android/app/src/main/AndroidManifest.xml || (echo "Auth deep-link entry missing from AndroidManifest.xml" && exit 1)
          grep -q 'android:host="chat"' android/app/src/main/AndroidManifest.xml || (echo "Chat deep-link entry missing from AndroidManifest.xml" && exit 1)

      - name: Add call permissions to the main manifest
        shell: bash
        run: |
          # Voice/video calls need the microphone and the camera. These
          # are dangerous permissions: the manifest entries below only
          # declare them — the app still asks the user at runtime (via
          # permission_handler) before getUserMedia. Same patch style as
          # the INTERNET step above; idempotent, skipped if already present.
          # flutter_webrtc declares no permissions itself, so the audio
          # and network ones must be declared here too:
          # Helper.setSpeakerphoneOn needs MODIFY_AUDIO_SETTINGS, and
          # Bluetooth routing needs BLUETOOTH_CONNECT on Android 12+
          # (BLUETOOTH covers older versions); ACCESS_NETWORK_STATE is
          # what the WebRTC stack checks for connectivity changes.
          # USE_FULL_SCREEN_INTENT is what lets the incoming-call
          # notification (helba_calls channel) show full-screen on
          # Android 14+; without it the notification is demoted to a
          # heads-up banner instead.
          # REQUEST_INSTALL_PACKAGES is what lets the in-app updater
          # install a downloaded APK via the package installer (the
          # updater downloads the release asset and asks Android to
          # install it); without it the install prompt is refused.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          wanted = [
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.BLUETOOTH",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.USE_FULL_SCREEN_INTENT",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          ]
          missing = [p for p in wanted if p not in source]
          if not missing:
              print("Call permissions already present")
          else:
              lines = source.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if line.lstrip().startswith("<manifest"):
                      j = i
                      while ">" not in lines[j]:
                          j += 1
                      for k, perm in enumerate(missing):
                          lines.insert(j + 1 + k, f'    <uses-permission android:name="{perm}" />\n')
                      break
              else:
                  raise SystemExit("Could not find <manifest> tag in AndroidManifest.xml")
              path.write_text("".join(lines))
              print("Added call permissions to AndroidManifest.xml: " + ", ".join(missing))
          PY

      - name: Verify call permissions in manifest
        run: |
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml || (echo "RECORD_AUDIO permission missing from AndroidManifest.xml" && exit 1)
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || (echo "CAMERA permission missing from AndroidManifest.xml" && exit 1)
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' android/app/src/main/AndroidManifest.xml || (echo "MODIFY_AUDIO_SETTINGS permission missing from AndroidManifest.xml" && exit 1)
          grep -q 'android.permission.BLUETOOTH_CONNECT' android/app/src/main/AndroidManifest.xml || (echo "BLUETOOTH_CONNECT permission missing from AndroidManifest.xml" && exit 1)
          grep -q 'android.permission.BLUETOOTH' android/app/src/main/AndroidManifest.xml || (echo "BLUETOOTH permission missing from AndroidManifest.xml" && exit 1)
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml || (echo "ACCESS_NETWORK_STATE permission missing from AndroidManifest.xml" && exit 1)
          grep -q 'android.permission.USE_FULL_SCREEN_INTENT' android/app/src/main/AndroidManifest.xml || (echo "USE_FULL_SCREEN_INTENT permission missing from AndroidManifest.xml" && exit 1)
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml || (echo "REQUEST_INSTALL_PACKAGES permission missing from AndroidManifest.xml" && exit 1)

      - name: Add FCM Installation ID opt-in to the main manifest
        shell: bash
        run: |
          # Firebase Cloud Messaging only registers an Installation ID
          # (FID) when the app opts in via this meta-data (Firebase
          # Flutter FCM guide). Without it, firebase_messaging's
          # onRegistered callback never fires, register() fails silently,
          # and no FID is ever upserted into push_tokens — so closed-app
          # push has nobody to send to. The firebase_messaging library
          # manifest does NOT contain this entry (only its example app
          # does), so insert it inside <application>, just before
          # </application>. Idempotent, skipped if already present.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          name = "firebase_messaging_installation_id_enabled"
          if name in source:
              print("FCM Installation ID opt-in meta-data already present")
          else:
              entry = '        <meta-data android:name="firebase_messaging_installation_id_enabled" android:value="true" />\n'
              marker = "</application>"
              if marker not in source:
                  raise SystemExit("Could not find </application> in AndroidManifest.xml")
              source = source.replace(marker, entry + marker, 1)
              path.write_text(source)
              print("Added FCM Installation ID opt-in meta-data to AndroidManifest.xml")
          PY

      - name: Verify FCM Installation ID opt-in in manifest
        run: |
          grep -q 'firebase_messaging_installation_id_enabled' android/app/src/main/AndroidManifest.xml || (echo "FCM Installation ID opt-in meta-data missing from AndroidManifest.xml" && exit 1)

      - name: Set Android compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              updated = source.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36",
              ).replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36",
              )
              if updated == source:
                  if "compileSdk = 36" in source or "compileSdkVersion 36" in source:
                      print(f"{path} already targets compile SDK 36")
                      raise SystemExit(0)
                  continue
              path.write_text(updated)
              print(f"Updated {path} to compile SDK 36")
              raise SystemExit(0)
          raise SystemExit("Could not find a supported Android app Gradle file or compileSdk setting")
          PY

      - name: Enable core library desugaring
        shell: bash
        run: |
          # flutter_local_notifications 22 requires core library desugaring
          # in the app module, or the build fails at checkReleaseAarMetadata
          # ("Dependency ':flutter_local_notifications' requires core library
          # desugaring to be enabled for :app"). The flutter create template
          # does not enable it, so patch the generated app Gradle file:
          # turn the flag on in compileOptions and add the desugar library.
          # Idempotent, and handles both the Kotlin (.kts) and Groovy
          # (.gradle) templates.
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              is_kts = path.suffix == ".kts"
              if "LibraryDesugaringEnabled" not in source:
                  marker = "compileOptions {"
                  if marker not in source:
                      raise SystemExit("Could not find compileOptions block in " + str(path))
                  flag = ("isCoreLibraryDesugaringEnabled = true"
                          if is_kts else
                          "coreLibraryDesugaringEnabled true")
                  source = source.replace(marker, marker + "\n        " + flag, 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if "desugar_jdk_libs" not in source:
                  if "dependencies {" in source:
                      source = source.replace("dependencies {",
                                              "dependencies {\n    " + dep, 1)
                  else:
                      source = source.rstrip() + "\n\ndependencies {\n    " + dep + "\n}\n"
              path.write_text(source)
              print(f"Enabled core library desugaring in {path}")
              raise SystemExit(0)
          raise SystemExit("Could not find a supported Android app Gradle file")
          PY

      - name: Verify core library desugaring
        run: |
          grep -q 'LibraryDesugaringEnabled' android/app/build.gradle* || (echo "Core library desugaring flag missing from app Gradle file" && exit 1)
          grep -q 'desugar_jdk_libs' android/app/build.gradle* || (echo "Desugar library missing from app Gradle file" && exit 1)

      - name: Install Android compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Fail if any plugin needs compileSdk above 36
        shell: bash
        run: |
          # NEVER silently rewrite compileSdk declarations again. The old
          # version of this step rewrote EVERY compileSdk line under
          # android/ and ~/.pub-cache to 36 — including plugins that
          # legitimately need a higher SDK (e.g.
          # permission_handler_android 14.x declares compileSdk = 37).
          # Downgrading such a plugin breaks the build with
          # "cannot find symbol" for API-36+ symbols. This step only
          # READS: it fails loudly, naming the file and the required
          # value, so the fix is a plugin pin change or a deliberate
          # target-SDK raise (see pubspec.yaml), not a silent downgrade.
          # Values <= 36 are left alone: the "Set Android compile SDK
          # to 36" step and the "Force compile SDK 36" init script
          # already handle the app module, and plugin declarations that
          # defer to flutter.compileSdkVersion / project.ext.compileSdk
          # (no literal number) resolve to the app's 36 at build time.
          # Current tree check (2026-11-06, pubspec.lock): nothing needs
          # more than 36 — permission_handler_android 13.0.1 is 35,
          # flutter_webrtc 1.6.3 / flutter_local_notifications 22.3.3 /
          # app_links 7.2.2 / native_flutter_proxy 0.3.1 are 36,
          # file_picker 8.3.7 / flutter_secure_storage 9.2.4 are 34,
          # firebase_* / url_launcher_android / video_player_android
          # defer to flutter.compileSdkVersion.
          python3 - <<'PY'
          import re
          from pathlib import Path

          MAX_COMPILE_SDK = 36
          # Matches literal declarations only: "compileSdk = 37",
          # "compileSdkVersion 37", "compileSdk 37". Deferring forms
          # ("compileSdk = flutter.compileSdkVersion",
          # "compileSdkVersion project.ext.compileSdk") carry no literal
          # number and are skipped by design.
          pattern = re.compile(r'compileSdk(?:Version)?\s*(?:=\s*)?(\d+)')

          roots = [Path("android"), Path.home() / ".pub-cache" / "hosted" / "pub.dev"]
          checked = 0
          offenders = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("build.gradle*"):
                  try:
                      lines = path.read_text().splitlines()
                  except (OSError, UnicodeDecodeError):
                      continue
                  for lineno, line in enumerate(lines, 1):
                      match = pattern.search(line)
                      if not match:
                          continue
                      checked += 1
                      value = int(match.group(1))
                      if value > MAX_COMPILE_SDK:
                          offenders.append(
                              f"Plugin {path}:{lineno} requires compileSdk {value} > {MAX_COMPILE_SDK}"
                          )
          if offenders:
              raise SystemExit(
                  "Plugin(s) require compileSdk above 36; update the plugin pin or raise the target SDK — see pubspec.yaml:\n"
                  + "\n".join(offenders)
              )
          print(f"Checked {checked} compileSdk declarations; none requires more than 36")
          PY

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Force compile SDK 36 for every Android module
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/force-compile-sdk.gradle" <<'EOF'
          allprojects {
              afterEvaluate {
                  def androidExtension = extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileSdkVersion(36)
                      println("HELBA: forced compileSdk 36 for " + project.path)
                  }
              }
          }
          EOF

      - name: Build release APK
        shell: bash
        run: |
          # Use repository secrets when configured; otherwise the build falls
          # back to the defaults compiled into lib/main.dart. Previously the
          # build silently ignored the secrets entirely.
          # No --verbose: under --verbose the --dart-define values for
          # SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY are echoed into CI
          # logs. --build-number overrides the +1 in pubspec version
          # 0.1.0+1 so every CI build ships a distinct versionCode
          # (without it, every build was versionCode 1).
          args=(--release --build-number=${{ github.run_number }})
          # Bake the commit SHA into the app so the login screen can show
          # which build is installed.
          args+=(--dart-define=HELBA_COMMIT=${{ github.sha }})
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            args+=(--dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }})
          fi
          if [ -n "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" ]; then
            args+=(--dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }})
          fi
          flutter build apk "${args[@]}"

      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify built APK contents
        shell: bash
        run: |
          # The greps above only check the generated source files before
          # the build. Verify the BUILT APK itself carries what push,
          # deep links and calls need — a flutter create drift or a
          # plugin manifest-merge failure would otherwise ship silently.
          # aapt2 dump xmltree prints each attribute's name and value on
          # one line (e.g. A: android:name(...)="android.permission.INTERNET"),
          # so grep for the literal names / package string, not for an
          # XML layout. The package must be com.example.helba: the
          # explicit FirebaseOptions in lib/src/push.dart hardcode that
          # package, and a drift would silently disable push.
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2="$SDK_HOME/build-tools/36.0.0/aapt2"
          if [ ! -x "$AAPT2" ]; then
            AAPT2=$(find "$SDK_HOME/build-tools" -name aapt2 -type f 2>/dev/null | head -1)
          fi
          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            echo "aapt2 not found under \$ANDROID_HOME/build-tools (build-tools 36.0.0 is installed by the 'Install Android compile SDK' step)" && exit 1
          fi
          DUMP=$("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK")
          echo "$DUMP" | grep -q 'android.permission.INTERNET' || (echo "Built APK is missing the INTERNET permission" && exit 1)
          echo "$DUMP" | grep -q 'android.permission.USE_FULL_SCREEN_INTENT' || (echo "Built APK is missing the USE_FULL_SCREEN_INTENT permission (incoming-call full-screen on Android 14+)" && exit 1)
          echo "$DUMP" | grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' || (echo "Built APK is missing the REQUEST_INSTALL_PACKAGES permission (in-app updater cannot install the downloaded APK)" && exit 1)
          echo "$DUMP" | grep -q 'android:scheme.*helba' || (echo "Built APK is missing the helba deep-link scheme" && exit 1)
          echo "$DUMP" | grep -q 'android:host.*auth' || (echo "Built APK is missing the auth deep-link host" && exit 1)
          echo "$DUMP" | grep -q 'android:host.*chat' || (echo "Built APK is missing the chat deep-link host" && exit 1)
          echo "$DUMP" | grep -q 'firebase_messaging_installation_id_enabled' || (echo "Built APK is missing the FCM Installation ID opt-in meta-data" && exit 1)
          echo "$DUMP" | grep -q 'package="com.example.helba"' || (echo "Built APK package is not com.example.helba (FirebaseOptions in lib/src/push.dart hardcode that package)" && exit 1)
          echo "Built APK verified: INTERNET, helba deep links (auth + chat), FID opt-in meta-data, package com.example.helba"

      - name: Verify stable signing certificate
        shell: bash
        run: |
          # Prove the APK was signed with the committed stable debug
          # keystore, not an ephemeral runner keystore: the signer
          # certificate SHA-256 must equal the fingerprint of
          # android/app/debug.keystore. If this fails, the build would
          # NOT install over the previous build and the user would have
          # to uninstall (wiping the E2E keys in secure storage).
          # apksigner prints the digest as plain lowercase hex without
          # separators, so the expected fingerprint is matched in that
          # form (07f66c4f…4bef); the comparison strips colons and case
          # so either printed form matches.
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$SDK_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(find "$SDK_HOME/build-tools" -name apksigner -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "apksigner not found under \$ANDROID_HOME/build-tools (build-tools 36.0.0 is installed by the 'Install Android compile SDK' step)" && exit 1
          fi
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          echo "$CERTS" | tr -d ':' | tr '[:upper:]' '[:lower:]' | grep -q '07f66c4f5a762a97427962e8dc0c377f2a08c59bd4394fca0361901565884bef' || (echo "APK certificate does NOT match the stable debug keystore fingerprint (07:F6:6C:4F:5A:76:2A:97:42:79:62:E8:DC:0C:37:7F:2A:08:C5:9B:D4:39:4F:CA:03:61:90:15:65:88:4B:EF) — refusing to ship an APK that cannot install over the previous build" && exit 1)
          echo "APK signed with the stable debug keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: helba-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Public release per build so the in-app updater (and the user)
          # can download the APK without signing in to GitHub: the
          # updater checks api.github.com/repos/abdo15542/helba/releases/latest
          # and installs the first .apk asset. Exactly ONE .apk asset per
          # release. Re-runs of the same workflow run reuse the same tag,
          # so an existing release for this tag is replaced first.
          APK=build/app/outputs/flutter-apk/app-release.apk
          TAG="build-${{ github.run_number }}"
          ASSET="helba-build-${{ github.run_number }}.apk"
          cp "$APK" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y --cleanup-tag
          fi
          gh release create "$TAG" "$ASSET" \
            --title "Helba build ${{ github.run_number }}" \
            --notes "Helba Android build ${{ github.run_number }} (commit ${{ github.sha }}). Signed with the stable debug keystore — installs over previous stable-signed builds, no uninstall needed."
